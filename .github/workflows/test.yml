name: Attendance API Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attendance-tests:
    name: Attendance API quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Always use the local mock in this assessment's CI.
      ATTENDANCE_API_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run attendance API tests
        run: python -m pytest -q --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: attendance-test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
